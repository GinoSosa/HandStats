name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Flet
        run: |
          python -m pip install --upgrade pip
          pip install flet

      - name: Compilar aplicación a APK
        run: flet build apk

      - name: Subir archivo APK para descargar
        uses: actions/upload-artifact@v4
        with:
          name: Handball_Stats_Salsipuedes_APK
          path: build/apk/*.apk